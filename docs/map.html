<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>據點地圖 - 地方物資管理平台</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>#map { height: 75vh; width: 100%; }</style>
</head>
<body>
  <div id="nav-placeholder"></div>

  <div class="container-fluid px-4">
    <div id="alertBox"></div>
    <div id="map" class="rounded shadow-sm"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="assets/app.js"></script>
  <script>
    (async function () {
      if (!requireLogin()) return;
      renderNav('map');

      const res = await guardedCall('getMapLocations', {});
      if (!res.success) {
        showAlert('alertBox', 'danger', res.message);
        return;
      }

      const locations = res.data.filter(l => l.Latitude && l.Longitude);
      const center = locations.length ? [Number(locations[0].Latitude), Number(locations[0].Longitude)] : [23.7, 120.5];
      const map = L.map('map').setView(center, locations.length ? 12 : 8);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      if (!locations.length) {
        showAlert('alertBox', 'warning', '目前沒有據點設有經緯度座標，地圖上暫無標記。');
      }

      locations.forEach(loc => {
        const marker = L.marker([Number(loc.Latitude), Number(loc.Longitude)]).addTo(map);
        marker.bindPopup(`
          <b>${escapeHtml(loc.LocationName)}</b><br>
          ${escapeHtml(loc.Address || '')}<br>
          聯絡人：${escapeHtml(loc.ContactPerson || '無')} ${escapeHtml(loc.Phone || '')}<br>
          <hr class="my-1">
          品項數：${loc.ItemCount}　總數量：${loc.TotalQuantity}<br>
          <span class="text-danger">低庫存：${loc.LowStockCount}</span>
          <span class="text-warning">即將過期：${loc.ExpiringSoonCount}</span>
        `);
      });
    })();
  </script>
</body>
</html>
