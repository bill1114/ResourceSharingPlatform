<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>據點地圖總覽 - 地方物資管理平台</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <header id="nav-placeholder"></header>
  <div class="container-fluid">
    <div class="container-fluid mt-4">
      <h2 class="mb-3"><i class="bi bi-geo-alt-fill"></i> 據點地圖總覽</h2>
      <div id="map" style="height: 700px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);"></div>
    </div>
  </div>

  <script src="assets/app.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    (async function () {
      if (!requireLogin()) return;
      renderNav('map');

      const map = L.map('map').setView([23.7078, 120.5439], 11);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);

      const [locRes, itemRes] = await Promise.all([callApi('getLocations'), callApi('getItems')]);
      const locations = (locRes.data || []).filter(l => l.IsActive && l.Latitude != null && l.Longitude != null);
      const items = (itemRes.data || []).filter(i => i.IsActive);

      if (locations.length === 0) {
        alert('目前沒有據點資料可顯示');
        return;
      }

      const today = new Date(); today.setHours(0, 0, 0, 0);
      const soon = new Date(today); soon.setDate(soon.getDate() + 30);

      locations.forEach(loc => {
        const locItems = items.filter(i => i.LocationId === loc.Id);
        const itemTypeCount = locItems.length;
        const totalQuantity = locItems.reduce((s, i) => s + i.Quantity, 0);
        const lowStockCount = locItems.filter(i => i.Quantity <= i.SafetyStock).length;
        const expiringSoonCount = locItems.filter(i => i.ExpirationDate && new Date(i.ExpirationDate) >= today && new Date(i.ExpirationDate) <= soon).length;

        let markerColor = 'blue';
        if (lowStockCount > 0) markerColor = 'red';
        else if (expiringSoonCount > 0) markerColor = 'orange';

        const customIcon = L.divIcon({
          className: 'custom-marker',
          html: `<div style="background-color: ${markerColor}; width: 30px; height: 30px; border-radius: 50%; border: 3px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.3);"></div>`,
          iconSize: [30, 30],
          iconAnchor: [15, 15]
        });

        const popupContent = `
          <div style="min-width: 250px;">
            <h5 class="mb-2"><i class="bi bi-building"></i> ${escapeHtml(loc.LocationName)}</h5>
            <hr>
            <p class="mb-1"><i class="bi bi-geo-alt"></i> <strong>地址：</strong>${escapeHtml(loc.Address) || '未設定'}</p>
            <p class="mb-1"><i class="bi bi-box"></i> <strong>物資種類：</strong>${itemTypeCount} 種</p>
            <p class="mb-1"><i class="bi bi-stack"></i> <strong>總物資數量：</strong>${totalQuantity}</p>
            ${lowStockCount > 0 ? `<p class="mb-1 text-danger"><i class="bi bi-exclamation-triangle-fill"></i> <strong>低庫存項目：</strong>${lowStockCount}</p>` : ''}
            ${expiringSoonCount > 0 ? `<p class="mb-1 text-warning"><i class="bi bi-clock-fill"></i> <strong>即期物資：</strong>${expiringSoonCount}</p>` : ''}
            <hr>
            <a href="items.html?locationId=${loc.Id}" class="btn btn-sm btn-primary w-100"><i class="bi bi-search"></i> 查看物資明細</a>
          </div>`;

        L.marker([loc.Latitude, loc.Longitude], { icon: customIcon }).addTo(map).bindPopup(popupContent);
      });
    })();
  </script>
</body>
</html>
