<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登入 - 地方物資管理平台</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
  <div class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card shadow-sm" style="width: 100%; max-width: 400px;">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-box-seam" style="font-size: 2.5rem;"></i>
          <h4 class="mt-2 mb-0">地方物資管理平台</h4>
          <div class="text-muted">請登入以繼續操作</div>
        </div>

        <div id="alertBox"></div>

        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label">帳號</label>
            <input id="userName" class="form-control" autofocus required />
          </div>
          <div class="mb-3">
            <label class="form-label">密碼</label>
            <input id="password" type="password" class="form-control" required />
          </div>
          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-box-arrow-in-right"></i> 登入
          </button>
        </form>
      </div>
    </div>
  </div>

  <script src="assets/app.js"></script>
  <script>
    if (currentUser()) location.href = 'dashboard.html';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const userName = document.getElementById('userName').value.trim();
      const password = document.getElementById('password').value;
      try {
        const res = await callApi('login', { userName, password });
        if (!res.success) {
          showAlert('alertBox', 'danger', res.message || '登入失敗');
          return;
        }
        sessionStorage.setItem('rsp_user', JSON.stringify(res.data));
        location.href = 'dashboard.html';
      } catch (err) {
        showAlert('alertBox', 'danger', '連線失敗：' + err.message);
      }
    });
  </script>
</body>
</html>
