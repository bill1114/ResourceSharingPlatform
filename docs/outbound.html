<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>物資出庫 - 地方物資管理平台</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
  <div id="nav-placeholder"></div>

  <div class="container-fluid px-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="mb-0">物資出庫</h4>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#outModal" id="btnAdd">
        <i class="bi bi-plus-lg"></i> 新增出庫
      </button>
    </div>
    <div id="alertBox"></div>

    <div class="row g-3">
      <div class="col-lg-8">
        <div class="card shadow-sm">
          <div class="card-header bg-white fw-bold">最近出庫紀錄</div>
          <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
              <thead class="table-light">
                <tr><th>時間</th><th>物資</th><th class="text-end">數量</th><th>領取人</th><th>經手人</th></tr>
              </thead>
              <tbody id="tbody"><tr><td colspan="5" class="text-center text-muted py-4">載入中...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="card shadow-sm">
          <div class="card-header bg-white fw-bold text-warning"><i class="bi bi-exclamation-triangle"></i> 即將過期物資</div>
          <ul class="list-group list-group-flush" id="expiringList"></ul>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="outModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="outForm">
          <div class="modal-header">
            <h5 class="modal-title">新增出庫</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="modalAlert"></div>
            <div class="mb-3">
              <label class="form-label">物資 *</label>
              <select class="form-select" id="fItem" required></select>
              <div class="form-text" id="stockHint"></div>
            </div>
            <div class="mb-3">
              <label class="form-label">出庫數量 *</label>
              <input type="number" min="1" class="form-control" id="fQty" required />
            </div>
            <div class="mb-3">
              <label class="form-label">領取人姓名 *</label>
              <input class="form-control" id="fRecipient" required />
            </div>
            <div class="mb-3">
              <label class="form-label">領取人聯絡方式</label>
              <input class="form-control" id="fContact" />
            </div>
            <div class="mb-3">
              <label class="form-label">備註</label>
              <textarea class="form-control" id="fRemark" rows="2"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
            <button type="submit" class="btn btn-primary">送出</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/app.js"></script>
  <script>
    let user, modal, items = [], locations = [];

    async function load() {
      const res = await guardedCall('listOutbound', {});
      if (!res.success) { showAlert('alertBox', 'danger', res.message); return; }
      document.getElementById('tbody').innerHTML = res.data.logs.map(l => `
        <tr>
          <td>${fmtDateTime(l.OutboundTime)}</td>
          <td>${escapeHtml(l.ItemName)}</td>
          <td class="text-end">${l.OutboundQuantity}</td>
          <td>${escapeHtml(l.RecipientName)}</td>
          <td>${escapeHtml(l.Operator || '')}</td>
        </tr>`).join('') || '<tr><td colspan="5" class="text-center text-muted py-4">尚無紀錄</td></tr>';

      document.getElementById('expiringList').innerHTML = res.data.expiringItems.map(i => `
        <li class="list-group-item d-flex justify-content-between">
          <span>${escapeHtml(i.ItemName)}<br><small class="text-muted">${escapeHtml(i.LocationName)}</small></span>
          <span class="text-warning">${fmtDate(i.ExpirationDate)}</span>
        </li>`).join('') || '<li class="list-group-item text-muted text-center">無即將過期物資</li>';
    }

    (async function () {
      user = requireLogin();
      if (!user) return;
      renderNav('outbound');
      modal = new bootstrap.Modal(document.getElementById('outModal'));

      const itemsRes = await guardedCall('listItems', {});
      items = itemsRes.success ? itemsRes.data : [];
      const locRes = await guardedCall('listLocations', {});
      locations = locRes.success ? locRes.data : [];
      const locName = (id) => (locations.find(l => l.Id === Number(id)) || {}).LocationName || '';

      document.getElementById('fItem').innerHTML = '<option value="">請選擇物資</option>' +
        items.map(i => `<option value="${i.Id}">${escapeHtml(i.ItemName)}（${escapeHtml(locName(i.LocationId))}，庫存 ${i.Quantity}）</option>`).join('');

      document.getElementById('fItem').addEventListener('change', (e) => {
        const it = items.find(i => i.Id === Number(e.target.value));
        document.getElementById('stockHint').textContent = it ? `目前庫存：${it.Quantity} ${it.Unit || ''}` : '';
      });

      document.getElementById('outForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
          supplyItemId: document.getElementById('fItem').value,
          outboundQuantity: document.getElementById('fQty').value,
          recipientName: document.getElementById('fRecipient').value.trim(),
          recipientContact: document.getElementById('fContact').value.trim(),
          remark: document.getElementById('fRemark').value.trim()
        };
        const res = await guardedCall('createOutbound', payload);
        if (!res.success) {
          document.getElementById('modalAlert').innerHTML = `<div class="alert alert-danger py-2">${escapeHtml(res.message)}</div>`;
          return;
        }
        modal.hide();
        document.getElementById('outForm').reset();
        document.getElementById('modalAlert').innerHTML = '';
        await load();
      });

      await load();
    })();
  </script>
</body>
</html>
