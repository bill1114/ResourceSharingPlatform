<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>物資管理 - 地方物資管理平台</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
  <div id="nav-placeholder"></div>

  <div class="container-fluid px-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="mb-0">物資管理</h4>
      <button class="btn btn-primary d-none" id="btnAdd" data-bs-toggle="modal" data-bs-target="#itemModal">
        <i class="bi bi-plus-lg"></i> 新增物資
      </button>
    </div>
    <div id="alertBox"></div>

    <div class="card shadow-sm mb-3">
      <div class="card-body row g-2">
        <div class="col-md-4">
          <select class="form-select" id="fltLocation"><option value="">所有據點</option></select>
        </div>
        <div class="col-md-4">
          <select class="form-select" id="fltCategory"><option value="">所有分類</option></select>
        </div>
        <div class="col-md-4">
          <select class="form-select" id="fltStockType">
            <option value="">所有庫存類型</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover mb-0 align-middle">
          <thead class="table-light">
            <tr>
              <th>圖片</th><th>物資名稱</th><th>分類</th><th>據點</th><th class="text-end">數量</th><th>類型</th><th>效期</th><th>狀態</th><th></th>
            </tr>
          </thead>
          <tbody id="tbody"><tr><td colspan="9" class="text-center text-muted py-4">載入中...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal fade" id="itemModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form id="itemForm">
          <div class="modal-header">
            <h5 class="modal-title" id="modalTitle">新增物資</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="fId" />
            <div id="modalAlert"></div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">分類 *</label>
                <select class="form-select" id="fCategory" required></select>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">物資名稱 *</label>
                <input class="form-control" id="fItemName" required />
              </div>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">規格</label>
                <input class="form-control" id="fSpec" />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">所屬據點 *</label>
                <select class="form-select" id="fLocation" required></select>
              </div>
            </div>
            <div class="row">
              <div class="col-md-3 mb-3">
                <label class="form-label">數量 *</label>
                <input type="number" min="0" class="form-control" id="fQuantity" required />
              </div>
              <div class="col-md-3 mb-3">
                <label class="form-label">單位</label>
                <input class="form-control" id="fUnit" />
              </div>
              <div class="col-md-3 mb-3">
                <label class="form-label">安全庫存 *</label>
                <input type="number" min="0" class="form-control" id="fSafetyStock" required />
              </div>
              <div class="col-md-3 mb-3">
                <label class="form-label">庫存類型</label>
                <select class="form-select" id="fStockType"></select>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">有效期限（無效期物資可留空）</label>
              <input type="date" class="form-control" id="fExpiration" />
            </div>
            <div class="mb-3">
              <label class="form-label">備註</label>
              <textarea class="form-control" id="fRemark" rows="2"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">圖片（jpg/png/webp，最大 5MB）</label>
              <input type="file" class="form-control" id="fImage" accept="image/jpeg,image/png,image/webp" />
              <div class="mt-2" id="imagePreviewWrap"></div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
            <button type="submit" class="btn btn-primary">儲存</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/app.js"></script>
  <script>
    let user, modal, items = [], locations = [];
    let pendingImage = null; // { base64, mimeType, fileName }
    let removeImageFlag = false;

    function locOptions(selectEl, includeAll) {
      selectEl.innerHTML = (includeAll ? '<option value="">所有據點</option>' : '<option value="">請選擇</option>') +
        locations.map(l => `<option value="${l.Id}">${escapeHtml(l.LocationName)}</option>`).join('');
    }

    function catOptions(selectEl, includeAll) {
      selectEl.innerHTML = (includeAll ? '<option value="">所有分類</option>' : '') +
        Categories.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    function stockTypeOptions(selectEl, includeAll) {
      selectEl.innerHTML = (includeAll ? '<option value="">所有庫存類型</option>' : '') +
        StockTypes.all.map(t => `<option value="${t}">${StockTypes.toDisplayName(t)}</option>`).join('');
    }

    async function load() {
      const payload = {
        locationId: document.getElementById('fltLocation').value || undefined,
        category: document.getElementById('fltCategory').value || undefined,
        stockType: document.getElementById('fltStockType').value || undefined
      };
      const res = await guardedCall('listItems', payload);
      if (!res.success) { showAlert('alertBox', 'danger', res.message); return; }
      items = res.data;
      renderTable();
    }

    function renderTable() {
      const canManage = user.RoleName === 'Admin' || user.RoleName === 'Cadre';
      const locName = (id) => (locations.find(l => l.Id === Number(id)) || {}).LocationName || '';
      document.getElementById('tbody').innerHTML = items.map(it => {
        const st = itemStatus(it);
        return `
        <tr>
          <td>${it.ImagePath ? `<img src="${it.ImagePath}" style="width:40px;height:40px;object-fit:cover;border-radius:4px;">` : '<span class="text-muted small">無</span>'}</td>
          <td>${escapeHtml(it.ItemName)}${it.Specification ? `<div class="text-muted small">${escapeHtml(it.Specification)}</div>` : ''}</td>
          <td>${escapeHtml(it.Category)}</td>
          <td><span class="badge" style="${locationBadgeStyle(it.LocationId)}">${escapeHtml(locName(it.LocationId))}</span></td>
          <td class="text-end">${it.Quantity} ${escapeHtml(it.Unit || '')}</td>
          <td><span class="badge ${StockTypes.toBadgeClass(it.StockType)}">${StockTypes.toDisplayName(it.StockType)}</span></td>
          <td>${fmtDate(it.ExpirationDate)}</td>
          <td><span class="badge ${st.cls}">${st.text}</span></td>
          <td class="text-end">
            ${canManage ? `
              <button class="btn btn-sm btn-outline-primary" onclick="editItem(${it.Id})"><i class="bi bi-pencil"></i></button>
              <button class="btn btn-sm btn-outline-danger" onclick="delItem(${it.Id})"><i class="bi bi-trash"></i></button>
            ` : ''}
          </td>
        </tr>`;
      }).join('') || '<tr><td colspan="9" class="text-center text-muted py-4">尚無物資</td></tr>';
    }

    function resetForm() {
      document.getElementById('itemForm').reset();
      document.getElementById('fId').value = '';
      document.getElementById('modalTitle').textContent = '新增物資';
      document.getElementById('modalAlert').innerHTML = '';
      document.getElementById('imagePreviewWrap').innerHTML = '';
      pendingImage = null;
      removeImageFlag = false;
    }

    window.editItem = function (id) {
      const it = items.find(x => x.Id === id);
      document.getElementById('fId').value = it.Id;
      document.getElementById('fCategory').value = it.Category;
      document.getElementById('fItemName').value = it.ItemName;
      document.getElementById('fSpec').value = it.Specification || '';
      document.getElementById('fLocation').value = it.LocationId;
      document.getElementById('fQuantity').value = it.Quantity;
      document.getElementById('fUnit').value = it.Unit || '';
      document.getElementById('fSafetyStock').value = it.SafetyStock;
      document.getElementById('fStockType').value = it.StockType || 'NoExpiry';
      document.getElementById('fExpiration').value = fmtDate(it.ExpirationDate);
      document.getElementById('fRemark').value = it.Remark || '';
      document.getElementById('modalTitle').textContent = '編輯物資';
      document.getElementById('imagePreviewWrap').innerHTML = it.ImagePath
        ? `<img src="${it.ImagePath}" style="max-width:120px;border-radius:4px;">` : '';
      pendingImage = null;
      removeImageFlag = false;
      modal.show();
    };

    window.delItem = async function (id) {
      if (!confirm('確定要刪除（停用）此物資嗎？')) return;
      const res = await guardedCall('deleteItem', { id });
      if (!res.success) { showAlert('alertBox', 'danger', res.message); return; }
      await load();
    };

    (async function () {
      user = requireLogin();
      if (!user) return;
      renderNav('items');
      modal = new bootstrap.Modal(document.getElementById('itemModal'));

      const canManage = user.RoleName === 'Admin' || user.RoleName === 'Cadre';
      if (canManage) document.getElementById('btnAdd').classList.remove('d-none');

      const locRes = await guardedCall('listLocations', {});
      locations = locRes.success ? locRes.data : [];
      locOptions(document.getElementById('fltLocation'), true);
      locOptions(document.getElementById('fLocation'), false);
      catOptions(document.getElementById('fltCategory'), true);
      catOptions(document.getElementById('fCategory'), false);
      stockTypeOptions(document.getElementById('fltStockType'), true);
      stockTypeOptions(document.getElementById('fStockType'), false);

      ['fltLocation', 'fltCategory', 'fltStockType'].forEach(id =>
        document.getElementById(id).addEventListener('change', load));

      document.getElementById('btnAdd').addEventListener('click', resetForm);

      document.getElementById('fImage').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 5 * 1024 * 1024) {
          document.getElementById('modalAlert').innerHTML = '<div class="alert alert-danger py-2">圖片大小不可超過 5MB</div>';
          e.target.value = '';
          return;
        }
        const base64 = await fileToBase64(file);
        pendingImage = { base64, mimeType: file.type, fileName: file.name };
        removeImageFlag = false;
        document.getElementById('imagePreviewWrap').innerHTML = `<img src="data:${file.type};base64,${base64}" style="max-width:120px;border-radius:4px;">`;
      });

      document.getElementById('itemForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('fId').value;
        const payload = {
          id: id || undefined,
          category: document.getElementById('fCategory').value,
          itemName: document.getElementById('fItemName').value.trim(),
          specification: document.getElementById('fSpec').value.trim(),
          locationId: document.getElementById('fLocation').value,
          quantity: document.getElementById('fQuantity').value,
          unit: document.getElementById('fUnit').value.trim(),
          safetyStock: document.getElementById('fSafetyStock').value,
          stockType: document.getElementById('fStockType').value,
          expirationDate: document.getElementById('fExpiration').value,
          remark: document.getElementById('fRemark').value.trim()
        };
        if (pendingImage) {
          payload.imageBase64 = pendingImage.base64;
          payload.imageMimeType = pendingImage.mimeType;
          payload.imageFileName = pendingImage.fileName;
        }
        if (removeImageFlag) payload.removeImage = true;

        const res = await guardedCall(id ? 'updateItem' : 'createItem', payload);
        if (!res.success) {
          document.getElementById('modalAlert').innerHTML = `<div class="alert alert-danger py-2">${escapeHtml(res.message)}</div>`;
          return;
        }
        modal.hide();
        await load();
      });

      await load();
    })();
  </script>
</body>
</html>
