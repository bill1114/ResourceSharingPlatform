<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>據點管理 - 地方物資管理平台</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
  <header id="nav-placeholder"></header>
  <div class="container-fluid">
    <div id="alertBox"></div>
    <main class="pb-3">
      <div class="container-fluid mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h2><i class="bi bi-buildings"></i> 據點管理</h2>
          <button class="btn btn-primary" id="btnNewLocation" style="display:none;"><i class="bi bi-plus-circle"></i> 新增據點</button>
        </div>
        <div class="card shadow-sm">
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-hover table-bordered">
                <thead class="table-light">
                  <tr><th>據點名稱</th><th>地址</th><th>聯絡人</th><th>聯絡電話</th><th>經緯度</th><th>建立時間</th><th width="160">操作</th></tr>
                </thead>
                <tbody id="locationsTbody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal fade" id="locationModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="locationModalTitle">新增據點</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="locationForm">
            <input type="hidden" id="f-Id" />
            <div class="mb-3">
              <label class="form-label">據點名稱 <span class="text-danger">*</span></label>
              <input id="f-LocationName" class="form-control" placeholder="例如：第一物資據點" required />
            </div>
            <div class="mb-3">
              <label class="form-label">地址</label>
              <input id="f-Address" class="form-control" placeholder="例如：雲林縣斗六市" />
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">緯度</label>
                <input id="f-Latitude" class="form-control" placeholder="例如：23.7078" />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">經度</label>
                <input id="f-Longitude" class="form-control" placeholder="例如：120.5439" />
              </div>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">聯絡人</label>
                <input id="f-ContactPerson" class="form-control" placeholder="例如：王先生" />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">聯絡電話</label>
                <input id="f-Phone" class="form-control" placeholder="例如：05-0000001" />
              </div>
            </div>
            <small class="text-muted">可至 <a href="https://www.google.com/maps" target="_blank">Google Maps</a> 查詢經緯度</small>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
          <button type="button" class="btn btn-primary" id="btnSaveLocation"><i class="bi bi-check-circle"></i> 儲存</button>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let allLocations = [];
    const user = requireLogin();
    const canEdit = user && (user.RoleName === 'Admin' || user.RoleName === 'Cadre');

    function render() {
      document.getElementById('locationsTbody').innerHTML = allLocations.filter(l => l.IsActive).map(l => `
        <tr>
          <td><strong>${escapeHtml(l.LocationName)}</strong></td>
          <td>${escapeHtml(l.Address)}</td>
          <td>${escapeHtml(l.ContactPerson)}</td>
          <td>${escapeHtml(l.Phone)}</td>
          <td>${l.Latitude != null && l.Longitude != null ? `<small class="text-muted">${l.Latitude}, ${l.Longitude}</small>` : '<span class="text-muted">未設定</span>'}</td>
          <td>${fmtDate(l.CreatedAt)}</td>
          <td>
            ${canEdit ? `<button class="btn btn-sm btn-warning" onclick="openEdit(${l.Id})" title="編輯"><i class="bi bi-pencil"></i></button>
            <button class="btn btn-sm btn-danger" onclick="deactivate(${l.Id})" title="停用"><i class="bi bi-trash"></i></button>` : ''}
          </td>
        </tr>`).join('');
    }

    function openCreate() {
      document.getElementById('locationModalTitle').textContent = '新增據點';
      document.getElementById('locationForm').reset();
      document.getElementById('f-Id').value = '';
      new bootstrap.Modal(document.getElementById('locationModal')).show();
    }

    window.openEdit = function (id) {
      const l = allLocations.find(x => x.Id === id);
      if (!l) return;
      document.getElementById('locationModalTitle').textContent = '編輯據點';
      document.getElementById('f-Id').value = l.Id;
      document.getElementById('f-LocationName').value = l.LocationName || '';
      document.getElementById('f-Address').value = l.Address || '';
      document.getElementById('f-Latitude').value = l.Latitude ?? '';
      document.getElementById('f-Longitude').value = l.Longitude ?? '';
      document.getElementById('f-ContactPerson').value = l.ContactPerson || '';
      document.getElementById('f-Phone').value = l.Phone || '';
      new bootstrap.Modal(document.getElementById('locationModal')).show();
    };

    window.deactivate = async function (id) {
      if (!confirm('確定要停用這個據點嗎？')) return;
      const l = allLocations.find(x => x.Id === id);
      l.IsActive = false;
      l.UpdatedAt = new Date().toISOString();
      await callApi('updateLocation', { location: l });
      showAlert('alertBox', 'success', '據點已停用！');
      await loadData();
    };

    document.getElementById('btnSaveLocation').addEventListener('click', async () => {
      const name = document.getElementById('f-LocationName').value.trim();
      if (!name) { alert('據點名稱為必填欄位'); return; }
      const id = document.getElementById('f-Id').value;
      const payload = {
        LocationName: name,
        Address: document.getElementById('f-Address').value,
        Latitude: document.getElementById('f-Latitude').value ? Number(document.getElementById('f-Latitude').value) : null,
        Longitude: document.getElementById('f-Longitude').value ? Number(document.getElementById('f-Longitude').value) : null,
        ContactPerson: document.getElementById('f-ContactPerson').value,
        Phone: document.getElementById('f-Phone').value,
        UpdatedAt: new Date().toISOString()
      };
      if (id) {
        payload.Id = Number(id);
        await callApi('updateLocation', { location: payload });
        showAlert('alertBox', 'success', '據點更新成功！');
      } else {
        await callApi('createLocation', { location: payload });
        showAlert('alertBox', 'success', '據點新增成功！');
      }
      bootstrap.Modal.getInstance(document.getElementById('locationModal')).hide();
      await loadData();
    });

    document.getElementById('btnNewLocation').addEventListener('click', openCreate);

    async function loadData() {
      const res = await callApi('getLocations');
      allLocations = res.data || [];
      render();
    }

    (async function () {
      if (!user) return;
      renderNav('locations');
      if (canEdit) document.getElementById('btnNewLocation').style.display = '';
      await loadData();
    })();
  </script>
</body>
</html>
