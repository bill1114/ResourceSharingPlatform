<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>據點管理 - 地方物資管理平台</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
  <div id="nav-placeholder"></div>

  <div class="container-fluid px-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="mb-0">據點管理</h4>
      <button class="btn btn-primary d-none" id="btnAdd" data-bs-toggle="modal" data-bs-target="#locModal">
        <i class="bi bi-plus-lg"></i> 新增據點
      </button>
    </div>
    <div id="alertBox"></div>

    <div class="card shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover mb-0 align-middle">
          <thead class="table-light">
            <tr>
              <th>據點名稱</th><th>地址</th><th>聯絡人</th><th>電話</th><th></th>
            </tr>
          </thead>
          <tbody id="tbody"><tr><td colspan="5" class="text-center text-muted py-4">載入中...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal fade" id="locModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="locForm">
          <div class="modal-header">
            <h5 class="modal-title" id="modalTitle">新增據點</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="fId" />
            <div id="modalAlert"></div>
            <div class="mb-3">
              <label class="form-label">據點名稱 *</label>
              <input class="form-control" id="fName" required />
            </div>
            <div class="mb-3">
              <label class="form-label">地址</label>
              <input class="form-control" id="fAddress" />
            </div>
            <div class="row">
              <div class="col-6 mb-3">
                <label class="form-label">緯度 Latitude</label>
                <input class="form-control" id="fLat" type="number" step="any" />
              </div>
              <div class="col-6 mb-3">
                <label class="form-label">經度 Longitude</label>
                <input class="form-control" id="fLng" type="number" step="any" />
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">聯絡人</label>
              <input class="form-control" id="fContact" />
            </div>
            <div class="mb-3">
              <label class="form-label">電話</label>
              <input class="form-control" id="fPhone" />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
            <button type="submit" class="btn btn-primary">儲存</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/app.js"></script>
  <script>
    let user, modal, locations = [];

    async function load() {
      const res = await guardedCall('listLocations', {});
      if (!res.success) { showAlert('alertBox', 'danger', res.message); return; }
      locations = res.data;
      renderTable();
    }

    function renderTable() {
      const canManage = user.RoleName === 'Admin' || user.RoleName === 'Cadre';
      document.getElementById('tbody').innerHTML = locations.map(l => `
        <tr>
          <td><span class="badge" style="${locationBadgeStyle(l.Id)}">${escapeHtml(l.LocationName)}</span></td>
          <td>${escapeHtml(l.Address || '')}</td>
          <td>${escapeHtml(l.ContactPerson || '')}</td>
          <td>${escapeHtml(l.Phone || '')}</td>
          <td class="text-end">
            ${canManage ? `
              <button class="btn btn-sm btn-outline-primary" onclick="editLoc(${l.Id})"><i class="bi bi-pencil"></i></button>
              <button class="btn btn-sm btn-outline-danger" onclick="delLoc(${l.Id})"><i class="bi bi-trash"></i></button>
            ` : ''}
          </td>
        </tr>`).join('') || '<tr><td colspan="5" class="text-center text-muted py-4">尚無據點</td></tr>';
    }

    function resetForm() {
      document.getElementById('locForm').reset();
      document.getElementById('fId').value = '';
      document.getElementById('modalTitle').textContent = '新增據點';
      document.getElementById('modalAlert').innerHTML = '';
    }

    window.editLoc = function (id) {
      const l = locations.find(x => x.Id === id);
      document.getElementById('fId').value = l.Id;
      document.getElementById('fName').value = l.LocationName;
      document.getElementById('fAddress').value = l.Address || '';
      document.getElementById('fLat').value = l.Latitude || '';
      document.getElementById('fLng').value = l.Longitude || '';
      document.getElementById('fContact').value = l.ContactPerson || '';
      document.getElementById('fPhone').value = l.Phone || '';
      document.getElementById('modalTitle').textContent = '編輯據點';
      modal.show();
    };

    window.delLoc = async function (id) {
      if (!confirm('確定要刪除（停用）此據點嗎？')) return;
      const res = await guardedCall('deleteLocation', { id });
      if (!res.success) { showAlert('alertBox', 'danger', res.message); return; }
      await load();
    };

    (async function () {
      user = requireLogin();
      if (!user) return;
      renderNav('locations');
      modal = new bootstrap.Modal(document.getElementById('locModal'));

      if (user.RoleName === 'Admin' || user.RoleName === 'Cadre') {
        document.getElementById('btnAdd').classList.remove('d-none');
      }
      document.getElementById('locModal').addEventListener('show.bs.modal', (e) => {
        if (e.target === document.getElementById('locModal') && !document.getElementById('fId').value) resetForm();
      });
      document.getElementById('btnAdd').addEventListener('click', resetForm);

      document.getElementById('locForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('fId').value;
        const payload = {
          id: id || undefined,
          locationName: document.getElementById('fName').value.trim(),
          address: document.getElementById('fAddress').value.trim(),
          latitude: document.getElementById('fLat').value || '',
          longitude: document.getElementById('fLng').value || '',
          contactPerson: document.getElementById('fContact').value.trim(),
          phone: document.getElementById('fPhone').value.trim()
        };
        const res = await guardedCall(id ? 'updateLocation' : 'createLocation', payload);
        if (!res.success) {
          document.getElementById('modalAlert').innerHTML = `<div class="alert alert-danger py-2">${escapeHtml(res.message)}</div>`;
          return;
        }
        modal.hide();
        await load();
      });

      await load();
    })();
  </script>
</body>
</html>
