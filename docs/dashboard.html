<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>戰情總覽 - 地方物資管理平台</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
  <header id="nav-placeholder"></header>
  <div class="container-fluid">
    <div id="alertBox"></div>
    <main class="pb-3">
      <div class="container-fluid mt-4">
        <h2 class="mb-4"><i class="bi bi-speedometer2"></i> 地方物資戰情總覽</h2>

        <div class="row g-3 mb-4">
          <div class="col-md-2">
            <div class="card shadow-sm border-0 bg-primary text-white">
              <div class="card-body">
                <h6><i class="bi bi-buildings"></i> 據點數</h6>
                <h2 class="mb-0" id="stat-locations">0</h2>
              </div>
            </div>
          </div>
          <div class="col-md-2">
            <div class="card shadow-sm border-0 bg-info text-white">
              <div class="card-body">
                <h6><i class="bi bi-box"></i> 物資種類</h6>
                <h2 class="mb-0" id="stat-itemtypes">0</h2>
              </div>
            </div>
          </div>
          <div class="col-md-2">
            <div class="card shadow-sm border-0 bg-success text-white">
              <div class="card-body">
                <h6><i class="bi bi-stack"></i> 總數量</h6>
                <h2 class="mb-0" id="stat-quantity">0</h2>
              </div>
            </div>
          </div>
          <div class="col-md-2">
            <div class="card shadow-sm border-danger">
              <div class="card-body text-danger">
                <h6><i class="bi bi-exclamation-triangle-fill"></i> 低庫存</h6>
                <h2 class="mb-0" id="stat-lowstock">0</h2>
              </div>
            </div>
          </div>
          <div class="col-md-2">
            <div class="card shadow-sm border-warning">
              <div class="card-body text-warning">
                <h6><i class="bi bi-clock-fill"></i> 即將過期</h6>
                <h2 class="mb-0" id="stat-expiring">0</h2>
              </div>
            </div>
          </div>
          <div class="col-md-2">
            <div class="card shadow-sm border-dark">
              <div class="card-body text-dark">
                <h6><i class="bi bi-x-circle-fill"></i> 已過期</h6>
                <h2 class="mb-0" id="stat-expired">0</h2>
              </div>
            </div>
          </div>
        </div>

        <div class="row mb-4">
          <div class="col-12">
            <div class="card shadow-sm">
              <div class="card-header bg-secondary text-white"><i class="bi bi-pin-map-fill"></i> 各據點物資統計</div>
              <div class="card-body">
                <div id="locationSummaryWrap"><p class="text-muted">載入中...</p></div>
              </div>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-4">
            <div class="card shadow-sm">
              <div class="card-header bg-danger text-white"><i class="bi bi-exclamation-triangle-fill"></i> 低於警戒水位物資</div>
              <div class="card-body"><div id="lowStockWrap"><p class="text-muted">載入中...</p></div></div>
            </div>
          </div>
          <div class="col-md-6 mb-4">
            <div class="card shadow-sm">
              <div class="card-header bg-warning text-dark"><i class="bi bi-clock-fill"></i> 即將過期物資</div>
              <div class="card-body"><div id="expiringWrap"><p class="text-muted">載入中...</p></div></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="assets/app.js"></script>
  <script>
    (async function () {
      if (!requireLogin()) return;
      renderNav('dashboard');

      const [locRes, itemRes] = await Promise.all([callApi('getLocations'), callApi('getItems')]);
      const locations = (locRes.data || []).filter(l => l.IsActive);
      const items = (itemRes.data || []).filter(i => i.IsActive);

      const today = new Date(); today.setHours(0, 0, 0, 0);
      const soon = new Date(today); soon.setDate(soon.getDate() + 30);

      const lowStockItems = items.filter(i => i.Quantity <= i.SafetyStock);
      const expiringItems = items.filter(i => i.ExpirationDate && new Date(i.ExpirationDate) >= today && new Date(i.ExpirationDate) <= soon);
      const expiredItems = items.filter(i => i.ExpirationDate && new Date(i.ExpirationDate) < today);

      document.getElementById('stat-locations').textContent = locations.length;
      document.getElementById('stat-itemtypes').textContent = items.length;
      document.getElementById('stat-quantity').textContent = items.reduce((s, i) => s + i.Quantity, 0);
      document.getElementById('stat-lowstock').textContent = lowStockItems.length;
      document.getElementById('stat-expiring').textContent = expiringItems.length;
      document.getElementById('stat-expired').textContent = expiredItems.length;

      const locationById = Object.fromEntries(locations.map(l => [l.Id, l]));

      if (locations.length === 0) {
        document.getElementById('locationSummaryWrap').innerHTML = '<p class="text-muted">目前沒有據點資料</p>';
      } else {
        const rows = locations.map(l => {
          const locItems = items.filter(i => i.LocationId === l.Id);
          const lowCount = locItems.filter(i => i.Quantity <= i.SafetyStock).length;
          return `<tr>
            <td><i class="bi bi-building"></i> ${escapeHtml(l.LocationName)}</td>
            <td>${locItems.length}</td>
            <td><strong>${locItems.reduce((s, i) => s + i.Quantity, 0)}</strong></td>
            <td>${lowCount > 0 ? `<span class="badge bg-danger">${lowCount}</span>` : '<span class="badge bg-success">正常</span>'}</td>
            <td><a href="items.html?locationId=${l.Id}" class="btn btn-sm btn-primary"><i class="bi bi-search"></i> 查看物資</a></td>
          </tr>`;
        }).join('');
        document.getElementById('locationSummaryWrap').innerHTML = `
          <div class="table-responsive"><table class="table table-bordered table-hover">
            <thead class="table-light"><tr><th>據點名稱</th><th>物資種類數</th><th>總數量</th><th>低庫存項目</th><th>操作</th></tr></thead>
            <tbody>${rows}</tbody>
          </table></div>`;
      }

      if (lowStockItems.length === 0) {
        document.getElementById('lowStockWrap').innerHTML = '<p class="text-muted">沒有低庫存物資</p>';
      } else {
        const rows = lowStockItems.slice(0, 10).map(i => `<tr>
          <td>${escapeHtml(locationById[i.LocationId]?.LocationName)}</td>
          <td><strong>${escapeHtml(i.ItemName)}</strong></td>
          <td class="text-danger"><strong>${i.Quantity}</strong> ${escapeHtml(i.Unit)}</td>
          <td>${i.SafetyStock} ${escapeHtml(i.Unit)}</td>
        </tr>`).join('');
        document.getElementById('lowStockWrap').innerHTML = `
          <div class="table-responsive"><table class="table table-bordered table-hover table-sm">
            <thead><tr><th>據點</th><th>物資</th><th>目前數量</th><th>安全庫存</th></tr></thead>
            <tbody>${rows}</tbody>
          </table></div>`;
      }

      if (expiringItems.length === 0) {
        document.getElementById('expiringWrap').innerHTML = '<p class="text-muted">沒有即將過期的物資</p>';
      } else {
        const rows = expiringItems.slice(0, 10).map(i => `<tr>
          <td>${escapeHtml(locationById[i.LocationId]?.LocationName)}</td>
          <td><strong>${escapeHtml(i.ItemName)}</strong></td>
          <td>${i.Quantity} ${escapeHtml(i.Unit)}</td>
          <td class="text-warning"><strong>${fmtDate(i.ExpirationDate)}</strong></td>
        </tr>`).join('');
        document.getElementById('expiringWrap').innerHTML = `
          <div class="table-responsive"><table class="table table-bordered table-hover table-sm">
            <thead><tr><th>據點</th><th>物資</th><th>數量</th><th>有效期限</th></tr></thead>
            <tbody>${rows}</tbody>
          </table></div>`;
      }
    })();
  </script>
</body>
</html>
