<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>戰情總覽 - 地方物資管理平台</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
  <div id="nav-placeholder"></div>

  <div class="container-fluid px-4">
    <div id="alertBox"></div>
    <div id="loading" class="text-center text-muted py-5"><div class="spinner-border"></div></div>

    <div id="content" class="d-none">
      <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
          <div class="card text-center shadow-sm h-100">
            <div class="card-body">
              <div class="text-muted small">據點數</div>
              <div class="fs-2 fw-bold" id="statLocations">0</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="card text-center shadow-sm h-100">
            <div class="card-body">
              <div class="text-muted small">物資品項數</div>
              <div class="fs-2 fw-bold" id="statItems">0</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="card text-center shadow-sm h-100 border-danger">
            <div class="card-body">
              <div class="text-muted small">低庫存</div>
              <div class="fs-2 fw-bold text-danger" id="statLow">0</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="card text-center shadow-sm h-100 border-warning">
            <div class="card-body">
              <div class="text-muted small">即將過期</div>
              <div class="fs-2 fw-bold text-warning" id="statExpiring">0</div>
            </div>
          </div>
        </div>
      </div>

      <div class="card shadow-sm">
        <div class="card-header bg-white fw-bold">各據點物資概況</div>
        <div class="table-responsive">
          <table class="table table-hover mb-0 align-middle">
            <thead class="table-light">
              <tr>
                <th>據點</th>
                <th class="text-end">品項數</th>
                <th class="text-end">總數量</th>
                <th class="text-end">低庫存</th>
                <th class="text-end">即將過期</th>
                <th class="text-end">已過期</th>
              </tr>
            </thead>
            <tbody id="locTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/app.js"></script>
  <script>
    (async function () {
      if (!requireLogin()) return;
      renderNav('dashboard');

      const res = await guardedCall('getDashboard', {});
      document.getElementById('loading').classList.add('d-none');
      if (!res.success) {
        showAlert('alertBox', 'danger', res.message);
        return;
      }
      document.getElementById('content').classList.remove('d-none');
      const d = res.data;
      document.getElementById('statLocations').textContent = d.TotalLocations;
      document.getElementById('statItems').textContent = d.TotalItems;
      document.getElementById('statLow').textContent = d.LowStockCount;
      document.getElementById('statExpiring').textContent = d.ExpiringSoonCount;

      const tbody = document.getElementById('locTableBody');
      tbody.innerHTML = d.LocationSummaries.map(l => `
        <tr>
          <td><span class="badge" style="${locationBadgeStyle(l.LocationId)}">${escapeHtml(l.LocationName)}</span></td>
          <td class="text-end">${l.ItemCount}</td>
          <td class="text-end">${l.TotalQuantity}</td>
          <td class="text-end ${l.LowStockCount > 0 ? 'text-danger fw-bold' : ''}">${l.LowStockCount}</td>
          <td class="text-end ${l.ExpiringSoonCount > 0 ? 'text-warning fw-bold' : ''}">${l.ExpiringSoonCount}</td>
          <td class="text-end ${l.ExpiredCount > 0 ? 'text-dark fw-bold' : ''}">${l.ExpiredCount}</td>
        </tr>`).join('') || '<tr><td colspan="6" class="text-center text-muted py-4">尚無資料</td></tr>';
    })();
  </script>
</body>
</html>
