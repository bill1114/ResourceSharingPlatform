<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>物資轉移 - 地方物資管理平台</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
  <div id="nav-placeholder"></div>

  <div class="container-fluid px-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="mb-0">物資轉移</h4>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#trModal" id="btnAdd">
        <i class="bi bi-plus-lg"></i> 新增轉移
      </button>
    </div>
    <div id="alertBox"></div>

    <div class="card shadow-sm">
      <div class="card-header bg-white fw-bold">最近轉移紀錄</div>
      <div class="table-responsive">
        <table class="table table-hover mb-0 align-middle">
          <thead class="table-light">
            <tr>
              <th>#</th><th>時間</th><th>物資</th><th class="text-end">數量</th><th>轉出</th><th>轉入</th><th>狀態</th><th>經手人</th><th></th>
            </tr>
          </thead>
          <tbody id="tbody"><tr><td colspan="9" class="text-center text-muted py-4">載入中...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal fade" id="trModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form id="trForm">
          <div class="modal-header">
            <h5 class="modal-title">新增轉移（可一次轉移多筆物資）</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="modalAlert"></div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">轉出據點 *</label>
                <select class="form-select" id="fFrom" required></select>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">轉入據點 *</label>
                <select class="form-select" id="fTo" required></select>
              </div>
            </div>
            <table class="table table-sm" id="lineTable">
              <thead><tr><th>#</th><th>物資</th><th style="width:120px;">數量</th><th></th></tr></thead>
              <tbody id="lineBody"></tbody>
            </table>
            <button type="button" class="btn btn-sm btn-outline-secondary" id="btnAddLine"><i class="bi bi-plus"></i> 新增一筆物資</button>
            <div class="mb-3 mt-3">
              <label class="form-label">備註</label>
              <textarea class="form-control" id="fRemark" rows="2"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
            <button type="submit" class="btn btn-primary">送出</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/app.js"></script>
  <script>
    let user, modal, items = [], locations = [], logs = [];
    let lineSeq = 0;

    function itemOptionsHtml() {
      return '<option value="">請選擇物資</option>' + items
        .filter(i => String(i.LocationId) === String(document.getElementById('fFrom').value))
        .map(i => `<option value="${i.Id}">${escapeHtml(i.ItemName)}（庫存 ${i.Quantity}）</option>`).join('');
    }

    function addLine() {
      lineSeq++;
      const tr = document.createElement('tr');
      tr.dataset.seq = lineSeq;
      tr.innerHTML = `
        <td class="align-middle">${lineSeq}</td>
        <td><select class="form-select form-select-sm line-item">${itemOptionsHtml()}</select></td>
        <td><input type="number" min="1" class="form-control form-control-sm line-qty" required /></td>
        <td><button type="button" class="btn btn-sm btn-outline-danger btn-remove-line"><i class="bi bi-x"></i></button></td>
      `;
      tr.querySelector('.btn-remove-line').addEventListener('click', () => tr.remove());
      document.getElementById('lineBody').appendChild(tr);
    }

    function refreshLineItemOptions() {
      document.querySelectorAll('.line-item').forEach(sel => {
        const cur = sel.value;
        sel.innerHTML = itemOptionsHtml();
        sel.value = cur;
      });
    }

    async function load() {
      const res = await guardedCall('listTransfers', {});
      if (!res.success) { showAlert('alertBox', 'danger', res.message); return; }
      logs = res.data;
      renderTable();
    }

    function renderTable() {
      document.getElementById('tbody').innerHTML = logs.map((l, idx) => {
        const canResolve = l.Status === 'Pending' && (user.RoleName === 'Admin' ||
          (user.LocationId && Number(user.LocationId) === Number(l.ToLocationId)));
        return `
        <tr>
          <td>${logs.length - idx}</td>
          <td>${fmtDateTime(l.TransferTime)}</td>
          <td>${escapeHtml(l.ItemName)}</td>
          <td class="text-end">${l.TransferQuantity}</td>
          <td><span class="badge" style="${locationBadgeStyle(l.FromLocationId)}">${escapeHtml(l.FromLocationName)}</span></td>
          <td><span class="badge" style="${locationBadgeStyle(l.ToLocationId)}">${escapeHtml(l.ToLocationName)}</span></td>
          <td><span class="badge ${TransferStatuses.toBadgeClass(l.Status)}">${TransferStatuses.toDisplayName(l.Status)}</span></td>
          <td>${escapeHtml(l.Operator || '')}</td>
          <td class="text-end">
            ${canResolve ? `
              <button class="btn btn-sm btn-success" onclick="doConfirm(${l.Id})"><i class="bi bi-check-lg"></i> 確認</button>
              <button class="btn btn-sm btn-outline-danger" onclick="doCancel(${l.Id})"><i class="bi bi-x-lg"></i> 取消</button>
            ` : ''}
          </td>
        </tr>`;
      }).join('') || '<tr><td colspan="9" class="text-center text-muted py-4">尚無紀錄</td></tr>';
    }

    window.doConfirm = async function (logId) {
      if (!confirm('確定要確認收到這筆轉移嗎？')) return;
      const res = await guardedCall('confirmTransfer', { logId });
      if (!res.success) { showAlert('alertBox', 'danger', res.message); return; }
      await load();
    };

    window.doCancel = async function (logId) {
      if (!confirm('確定要取消這筆轉移嗎？')) return;
      const res = await guardedCall('cancelTransfer', { logId });
      if (!res.success) { showAlert('alertBox', 'danger', res.message); return; }
      await load();
    };

    (async function () {
      user = requireLogin();
      if (!user) return;
      renderNav('transfer');
      if (!(user.RoleName === 'Admin' || user.RoleName === 'Cadre')) {
        document.getElementById('btnAdd').classList.add('d-none');
      }
      modal = new bootstrap.Modal(document.getElementById('trModal'));

      const itemsRes = await guardedCall('listItems', {});
      items = itemsRes.success ? itemsRes.data : [];
      const locRes = await guardedCall('listLocations', {});
      locations = locRes.success ? locRes.data : [];

      const locHtml = '<option value="">請選擇</option>' + locations.map(l => `<option value="${l.Id}">${escapeHtml(l.LocationName)}</option>`).join('');
      document.getElementById('fFrom').innerHTML = locHtml;
      document.getElementById('fTo').innerHTML = locHtml;
      document.getElementById('fFrom').addEventListener('change', refreshLineItemOptions);

      document.getElementById('btnAddLine').addEventListener('click', addLine);
      document.getElementById('btnAdd').addEventListener('click', () => {
        document.getElementById('trForm').reset();
        document.getElementById('lineBody').innerHTML = '';
        document.getElementById('modalAlert').innerHTML = '';
        lineSeq = 0;
        addLine();
      });

      document.getElementById('trForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const lines = [...document.querySelectorAll('#lineBody tr')].map(tr => ({
          itemId: tr.querySelector('.line-item').value,
          quantity: tr.querySelector('.line-qty').value
        })).filter(l => l.itemId && l.quantity);

        if (!lines.length) {
          document.getElementById('modalAlert').innerHTML = '<div class="alert alert-danger py-2">請至少新增一筆物資</div>';
          return;
        }

        const payload = {
          fromLocationId: document.getElementById('fFrom').value,
          toLocationId: document.getElementById('fTo').value,
          remark: document.getElementById('fRemark').value.trim(),
          lines
        };
        const res = await guardedCall('createTransferBatch', payload);
        if (!res.success) {
          document.getElementById('modalAlert').innerHTML = `<div class="alert alert-danger py-2">${escapeHtml(res.message)}</div>`;
          return;
        }
        modal.hide();
        await load();
      });

      await load();
    })();
  </script>
</body>
</html>
