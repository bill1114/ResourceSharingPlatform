<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>帳號管理 - 地方物資管理平台</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
  <div id="nav-placeholder"></div>

  <div class="container-fluid px-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="mb-0">帳號管理</h4>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#userModal" id="btnAdd">
        <i class="bi bi-plus-lg"></i> 新增帳號
      </button>
    </div>
    <div id="alertBox"></div>

    <div class="card shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover mb-0 align-middle">
          <thead class="table-light">
            <tr><th>帳號</th><th>姓名</th><th>角色</th><th>據點</th><th>狀態</th><th></th></tr>
          </thead>
          <tbody id="tbody"><tr><td colspan="6" class="text-center text-muted py-4">載入中...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal fade" id="userModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="userForm">
          <div class="modal-header">
            <h5 class="modal-title" id="modalTitle">新增帳號</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="fId" />
            <div id="modalAlert"></div>
            <div class="mb-3">
              <label class="form-label">帳號 *</label>
              <input class="form-control" id="fUserName" required />
            </div>
            <div class="mb-3">
              <label class="form-label">密碼 <span id="pwHint" class="text-muted small"></span></label>
              <input type="password" class="form-control" id="fPassword" />
            </div>
            <div class="mb-3">
              <label class="form-label">姓名</label>
              <input class="form-control" id="fDisplayName" />
            </div>
            <div class="mb-3">
              <label class="form-label">角色 *</label>
              <select class="form-select" id="fRole" required>
                <option value="Admin">管理人員</option>
                <option value="Cadre">幹部</option>
                <option value="SocialWorker">社工</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">所屬據點（用於轉移確認權限）</label>
              <select class="form-select" id="fLocation"><option value="">無</option></select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
            <button type="submit" class="btn btn-primary">儲存</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/app.js"></script>
  <script>
    let user, modal, users = [], locations = [];

    async function load() {
      const res = await guardedCall('listUsers', {});
      if (!res.success) { showAlert('alertBox', 'danger', res.message); return; }
      users = res.data;
      renderTable();
    }

    function renderTable() {
      const locName = (id) => (locations.find(l => l.Id === Number(id)) || {}).LocationName || '';
      document.getElementById('tbody').innerHTML = users.map(u => `
        <tr>
          <td>${escapeHtml(u.UserName)}</td>
          <td>${escapeHtml(u.DisplayName || '')}</td>
          <td>${Roles.toDisplayName(u.RoleName)}</td>
          <td>${u.LocationId ? `<span class="badge" style="${locationBadgeStyle(u.LocationId)}">${escapeHtml(locName(u.LocationId))}</span>` : '<span class="text-muted">-</span>'}</td>
          <td>${u.IsActive ? '<span class="badge bg-success">啟用</span>' : '<span class="badge bg-secondary">停用</span>'}</td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-primary" onclick="editUser(${u.Id})"><i class="bi bi-pencil"></i></button>
            ${u.IsActive ? `<button class="btn btn-sm btn-outline-danger" onclick="delUser(${u.Id})"><i class="bi bi-trash"></i></button>` : ''}
          </td>
        </tr>`).join('') || '<tr><td colspan="6" class="text-center text-muted py-4">尚無帳號</td></tr>';
    }

    function resetForm() {
      document.getElementById('userForm').reset();
      document.getElementById('fId').value = '';
      document.getElementById('modalTitle').textContent = '新增帳號';
      document.getElementById('modalAlert').innerHTML = '';
      document.getElementById('fPassword').required = true;
      document.getElementById('pwHint').textContent = '';
    }

    window.editUser = function (id) {
      const u = users.find(x => x.Id === id);
      document.getElementById('fId').value = u.Id;
      document.getElementById('fUserName').value = u.UserName;
      document.getElementById('fPassword').value = '';
      document.getElementById('fPassword').required = false;
      document.getElementById('pwHint').textContent = '（留空表示不變更密碼）';
      document.getElementById('fDisplayName').value = u.DisplayName || '';
      document.getElementById('fRole').value = u.RoleName;
      document.getElementById('fLocation').value = u.LocationId || '';
      document.getElementById('modalTitle').textContent = '編輯帳號';
      document.getElementById('modalAlert').innerHTML = '';
      modal.show();
    };

    window.delUser = async function (id) {
      if (!confirm('確定要停用此帳號嗎？')) return;
      const res = await guardedCall('deleteUser', { id });
      if (!res.success) { showAlert('alertBox', 'danger', res.message); return; }
      await load();
    };

    (async function () {
      user = requireLogin();
      if (!user) return;
      if (user.RoleName !== 'Admin') { location.href = 'dashboard.html'; return; }
      renderNav('users');
      modal = new bootstrap.Modal(document.getElementById('userModal'));

      const locRes = await guardedCall('listLocations', {});
      locations = locRes.success ? locRes.data : [];
      document.getElementById('fLocation').innerHTML = '<option value="">無</option>' +
        locations.map(l => `<option value="${l.Id}">${escapeHtml(l.LocationName)}</option>`).join('');

      document.getElementById('btnAdd').addEventListener('click', resetForm);

      document.getElementById('userForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('fId').value;
        const payload = {
          id: id || undefined,
          userName: document.getElementById('fUserName').value.trim(),
          password: document.getElementById('fPassword').value,
          displayName: document.getElementById('fDisplayName').value.trim(),
          roleName: document.getElementById('fRole').value,
          locationId: document.getElementById('fLocation').value
        };
        const res = await guardedCall(id ? 'updateUser' : 'createUser', payload);
        if (!res.success) {
          document.getElementById('modalAlert').innerHTML = `<div class="alert alert-danger py-2">${escapeHtml(res.message)}</div>`;
          return;
        }
        modal.hide();
        await load();
      });

      await load();
    })();
  </script>
</body>
</html>
